name: ci-brain

on:
  push:
    branches: [main]
    paths:
      - "apps/brain/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci-brain.yml"
  pull_request:
    paths:
      - "apps/brain/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci-brain.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Tesseract OCR
        # OCR checkpoint (§21 Phase 3): pytesseract is a thin wrapper around
        # the tesseract binary/library, not a self-contained engine -- the
        # binary has to actually exist on the runner or every OCR-path test
        # fails closed with OcrExtractionError/TesseractNotFoundError
        # rather than skipping. Matches CLAUDE.md's dev-engine note: this
        # is the same Tesseract-for-non-x86-dev choice, run here because
        # ubuntu-latest (x86_64) is still what CI runs on regardless of
        # this being a dev-only engine choice for the arm64 local machine.
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: uv sync --project apps/brain

      - name: Cache Flyway CLI
        uses: actions/cache@v4
        with:
          path: /tmp/flyway-cli
          key: flyway-cli-10.10.0

      - name: Apply apps/core Flyway migrations
        # This job is deliberately self-sufficient rather than depending on
        # ci-core.yml having run first. Two reasons that ordering can't be
        # relied on, not just one: (1) today's CI Neon branch is a single
        # persistent branch (see ci-core.yml's comment), so the two
        # workflows racing on the very first PR that adds a migration
        # ci-brain's tests depend on is a real, recurring possibility --
        # every future migration a brain test newly depends on reopens the
        # same race, it isn't a one-off from V11/V12 specifically; (2) if
        # this project ever implements the branch-per-PR CI database this
        # file's tech-choices table used to (incorrectly) claim was already
        # done -- see CLAUDE.md's "Managed DB (CI)" row and its Phase 3
        # note -- there would be no prior ci-core run against that PR's
        # fresh branch to depend on *at all*, on every single PR. Running
        # Flyway directly here is correct under both today's setup and
        # that future one; a workflow_run/needs dependency on ci-core would
        # only have covered today's case.
        #
        # apps/brain owns no migrations itself (schema ownership is
        # apps/core's, per the blueprint), so this uses the standalone
        # Flyway CLI against DATABASE_URL directly rather than running
        # apps/core's Gradle build just to get its Flyway bean to fire --
        # no JDK/Gradle needed in this job. Idempotent: Flyway's own
        # schema-history tracking makes re-running this a no-op once a
        # migration has already been applied by any prior run (this job's
        # or ci-core's), regardless of which one got there first.
        env:
          # Owner role (rolbypassrls=true) -- the only role with the
          # DDL/GRANT privileges migrations need, exactly like apps/core's
          # own FlywayConfig. APP_DB_PASSWORD is required even though this
          # job only tests apps/brain: Flyway applies every migration in
          # order, and V2 needs app_db_password regardless of what's under
          # test here.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
          BRAIN_DB_PASSWORD: ${{ secrets.BRAIN_DB_PASSWORD }}
        run: |
          set -euo pipefail

          # Must track apps/core's actual resolved Flyway version (Spring
          # Boot's BOM manages it -- there's no explicit version pin to
          # read). Check with:
          #   ./gradlew :apps:core:dependencies --configuration runtimeClasspath | grep flyway-core
          # and update both this and the cache key above if it drifts.
          # Verified locally against the real dev Neon branch (info +
          # migrate, both idempotent no-ops against already-applied
          # migrations) before trusting this in CI.
          FLYWAY_VERSION="10.10.0"
          FLYWAY_HOME="/tmp/flyway-cli/flyway-${FLYWAY_VERSION}"

          if [ ! -x "${FLYWAY_HOME}/flyway" ]; then
            mkdir -p /tmp/flyway-cli
            curl -sSL -o /tmp/flyway.tar.gz \
              "https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/${FLYWAY_VERSION}/flyway-commandline-${FLYWAY_VERSION}.tar.gz"
            tar -xzf /tmp/flyway.tar.gz -C /tmp/flyway-cli
          fi

          # Parses DATABASE_URL into a JDBC URL + owner credentials the
          # same way DatabaseConnectionDetails.parse() does on the Java
          # side -- same level of rigor as that code (no URL-decoding of
          # the password; matches the format DATABASE_URL is actually in
          # today). Plain bash regex rather than a Python heredoc: this
          # `run:` block is itself a YAML block scalar, so a heredoc body
          # here carries the step's own indentation as literal leading
          # whitespace into whatever reads it -- harmless for another
          # shell command, but a Python heredoc would read those spaces as
          # real indentation and fail with IndentationError. Verified
          # locally under bash (the shell GitHub Actions actually runs
          # `run:` steps with) against the real DATABASE_URL before
          # trusting it here.
          if [[ "$DATABASE_URL" =~ ^postgresql://([^:]+):([^@]+)@([^:/]+)(:([0-9]+))?/([^?]+)(\?(.*))?$ ]]; then
            OWNER_USER="${BASH_REMATCH[1]}"
            OWNER_PASSWORD="${BASH_REMATCH[2]}"
            HOST="${BASH_REMATCH[3]}"
            PORT="${BASH_REMATCH[5]}"
            DBNAME="${BASH_REMATCH[6]}"
            QUERY="${BASH_REMATCH[8]}"
          else
            echo "Could not parse DATABASE_URL" >&2
            exit 1
          fi

          JDBC_URL="jdbc:postgresql://${HOST}"
          [ -n "$PORT" ] && JDBC_URL="${JDBC_URL}:${PORT}"
          JDBC_URL="${JDBC_URL}/${DBNAME}"
          [ -n "$QUERY" ] && JDBC_URL="${JDBC_URL}?${QUERY}"

          "${FLYWAY_HOME}/flyway" \
            "-url=${JDBC_URL}" \
            "-user=${OWNER_USER}" \
            "-password=${OWNER_PASSWORD}" \
            "-locations=filesystem:apps/core/src/main/resources/db/migration" \
            "-placeholders.app_db_password=${APP_DB_PASSWORD}" \
            "-placeholders.brain_db_password=${BRAIN_DB_PASSWORD}" \
            migrate

      - name: Check for migration drift
        # Runs immediately after the Flyway apply step above, in CI's own
        # environment -- genuinely different from local dev, where
        # apps/brain/src/obligo_brain/scripts/check_migrations.py's
        # `make check-migrations` invocation is what's supposed to catch
        # this before it ships (the real gap: V17__create_agent_runs.sql
        # sat merged-but-unapplied for a whole Phase 4 checkpoint because
        # local dev had no equivalent check). This step exists to prove
        # the checker behaves correctly here too, not just locally: it
        # reuses the Flyway CLI already downloaded to /tmp/flyway-cli by
        # the step above (same conventional path the script itself
        # checks first), and must report zero drift immediately after a
        # real `flyway migrate` run against the real CI branch -- a
        # false positive here would mean this checker can't be trusted
        # anywhere.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
          BRAIN_DB_PASSWORD: ${{ secrets.BRAIN_DB_PASSWORD }}
        run: uv run --project apps/brain python -m obligo_brain.scripts.check_migrations

      - name: Run tests
        env:
          # Same CI Neon branch, now guaranteed migrated by the step above
          # regardless of ci-core's scheduling. DATABASE_URL (owner role)
          # is used only to seed/tear down fixture rows in
          # organizations/users/sources -- see test_tenant_isolation.py's
          # docstring for why obligo_brain can't do that itself.
          # BRAIN_DB_PASSWORD is the login for the obligo_brain role the
          # actual tenant-isolation assertions run as. APP_DB_PASSWORD is
          # added here (previously only present in the Flyway-apply step
          # above) so tests/scripts/test_check_migrations.py's one live
          # test -- the one that has to pass for a real reason -- actually
          # runs in CI instead of skipping for missing env, same as the
          # "Check for migration drift" step just above needing it.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
          BRAIN_DB_PASSWORD: ${{ secrets.BRAIN_DB_PASSWORD }}
          # Added for the segmentation checkpoint (§21 Phase 3):
          # test_segment_source.py needs real Supabase Storage to prove the
          # full fetch-extract-persist path, no mocks -- same three vars
          # ci-core.yml already wires for SourceUploadFlowTest, reused here
          # rather than duplicated under a different name. Without these,
          # that test file skips cleanly (see its own skipif); with them,
          # it actually runs. tests/ingestion/test_pdf_round_trip.py (the
          # pure-unit round-trip proof) needs neither DB nor storage and
          # always runs regardless.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
          # Interim apps/core <-> apps/brain shared-secret gate (see
          # CLAUDE.md's debt list -- this is not real per-request auth, just
          # the cheapest defense-in-depth against the endpoint being
          # reachable from somewhere it shouldn't be). Required for
          # test_segment_source.py's real-infra tests to run rather than
          # skip; must exist as a repo secret for this to have any value
          # here, same as the others in this block.
          BRAIN_SERVICE_TOKEN: ${{ secrets.BRAIN_SERVICE_TOKEN }}
          # Async-segmentation checkpoint (§21 Phase 3): Celery's broker
          # connection (Upstash Redis TCP+TLS, a different credential pair
          # from UPSTASH_REDIS_REST_URL/TOKEN -- see .env.example). Most of
          # this checkpoint's tests (tests/tasks/test_segmentation_task.py,
          # most of tests/api/test_segment_source.py) deliberately need
          # NO broker at all -- they use Celery's .apply() (in-process,
          # synchronous, no broker) or specifically test the
          # broker-unavailable failure path. Only
          # tests/tasks/test_celery_broker_integration.py (the real
          # .delay()->Redis->separate-worker-process round trip and
          # acks_late's redelivery behavior) needs this -- skips cleanly if
          # unset, same pattern as the other real-infra guards in this
          # file. Must exist as a repo secret (added via the GitHub UI, not
          # this file) for that one file to run rather than skip.
          CELERY_BROKER_URL: ${{ secrets.CELERY_BROKER_URL }}
        run: uv run --project apps/brain pytest -v
