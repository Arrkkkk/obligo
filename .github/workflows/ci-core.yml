name: ci-core

on:
  push:
    branches: [main]
    paths:
      - "apps/core/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/ci-core.yml"
  pull_request:
    paths:
      - "apps/core/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/ci-core.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        env:
          # Dedicated Neon branch for CI only (see V1-V3 migrations under
          # apps/core/src/main/resources/db/migration) — separate from the
          # local dev branch in .env. DATABASE_URL is the owner role, used
          # only to run Flyway; APP_DB_PASSWORD is the login for the
          # least-privileged obligo_app role Flyway provisions and that the
          # app's Hikari pool actually queries as (see blueprint §10.9 on
          # why the app can't run as the owner role).
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
        run: ./gradlew build
