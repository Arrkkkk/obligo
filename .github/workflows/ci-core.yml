name: ci-core

on:
  push:
    branches: [main]
    paths:
      - "apps/core/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/ci-core.yml"
  pull_request:
    paths:
      - "apps/core/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/ci-core.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        env:
          # Dedicated Neon branch for CI only (see V1-V3 migrations under
          # apps/core/src/main/resources/db/migration) — separate from the
          # local dev branch in .env. DATABASE_URL is the owner role, used
          # only to run Flyway; APP_DB_PASSWORD is the login for the
          # least-privileged obligo_app role Flyway provisions and that the
          # app's Hikari pool actually queries as (see blueprint §10.9 on
          # why the app can't run as the owner role).
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
          # obligo_brain (V11) — required unconditionally by FlywayConfig
          # for the same reason APP_DB_PASSWORD is: Flyway migrations
          # always run to boot the app, and V11 needs this placeholder.
          # Omitting it here previously broke every test needing the
          # Spring context (IllegalStateException at bean construction),
          # not just apps/brain-related ones — same failure shape as the
          # BlobStoreConfig regression CLAUDE.md documents, caught the
          # same way: a real CI run, not assumed fixed by inspection.
          BRAIN_DB_PASSWORD: ${{ secrets.BRAIN_DB_PASSWORD }}
          # Same Supabase project as local dev (§11's "sources" bucket) —
          # unlike Neon, Supabase Storage has no low-cost per-branch
          # bucket, so CI writes to the same shared bucket. Safe because
          # every object key is namespaced by a fresh UUID source_id
          # (SourceUploadService) and every test in SourceUploadFlowTest/
          # BucketConfigAgreementTest deletes what it creates in @AfterEach
          # — verified empty after both local and CI runs, not assumed.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
          # §21 Phase 3 SSE checkpoint (SegmentationFlowTest, BrainClientTest)
          # — the real apps/brain service is never actually contacted in
          # this job (a FakeBrainServer stands in, see FakeBrainServer's own
          # javadoc for why); this secret only needs to be *some* non-empty
          # value so BrainClientConfig's @Conditional bean gets created and
          # so @EnabledIfEnvironmentVariable doesn't skip these tests.
          # Already an existing repo secret, reused from ci-brain.yml — not
          # a new one.
          BRAIN_SERVICE_TOKEN: ${{ secrets.BRAIN_SERVICE_TOKEN }}
        run: ./gradlew build
