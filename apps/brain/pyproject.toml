[project]
name = "obligo-brain"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pymupdf>=1.24",
    "httpx>=0.27",
    "pytesseract>=0.3.13",
    "pillow>=11.0",
    "celery[redis]>=5.5",
    "lark>=1.2",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.115",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obligo_brain"]
