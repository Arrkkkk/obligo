# Homebrew installs openjdk@21 keg-only (it's not linked as the system `java`,
# since a newer JDK is the Homebrew default). Point Gradle at it directly so
# ./gradlew works without exporting JAVA_HOME by hand every session.
#
# If this path doesn't exist on your machine, see docs/DEVELOPMENT.md.
org.gradle.java.home=/opt/homebrew/opt/openjdk@21
